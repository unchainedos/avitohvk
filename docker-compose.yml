services:
  postgres:
    image: postgres:17
    container_name: avitohvk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net

  init_container:
    image: postgres:17
    container_name: avitohvk-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - app-net
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Postgres..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do
          sleep 1
        done
        echo "Applying migrations..."
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        for f in $$(ls /migrations/*_up.sql | sort); do
          echo "→ $$f"
          psql -h "$$PGHOST" -p "$$PGPORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "Migrations applied successfully"

  # Добавленный сервис приложения
  app:
    build: .
    container_name: avitohvk-app
    depends_on:
      postgres:
        condition: service_healthy
      init_container:
        condition: service_completed_successfully
    ports:
      - "8080:8080"  # ХОСТ:КОНТЕЙНЕР
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build: ./web
    container_name: avitohvk-frontend
    depends_on:
      - app
    ports:
      - "3000:5173"
    networks:
      - app-net
    restart: unless-stopped


volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge



  